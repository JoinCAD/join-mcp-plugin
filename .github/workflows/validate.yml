name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Pinned so a CLI release can't change the result of an unchanged commit.
      # Bump it deliberately; validation rules grow with the CLI.
      CLAUDE_CODE_VERSION: 2.1.285
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate plugin manifest, skills and .mcp.json
        run: claude plugin validate --strict .claude-plugin/plugin.json

      - name: Validate marketplace
        run: claude plugin validate --strict .claude-plugin/marketplace.json
